{{define "title"}} - Reset Password{{end}}

{{define "brandExtra"}}{{end}}

{{define "content"}}
<div class="login-header">
    <h2>Reset password</h2>
    <p>Enter your new password below.</p>
</div>

<div id="alertError" class="alert-error">{{.Error}}</div>

<form id="resetForm" method="POST" action="/reset-password" onsubmit="return handleSubmit(event)">
    <input type="hidden" name="token" value="{{.Token}}">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

    <div class="form-group">
        <label for="password">New password</label>
        <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
            <button type="button" class="input-toggle" onclick="togglePassword('password')" aria-label="Toggle password visibility">
                <svg id="eyeIcon1" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>
        <div class="error-message">Password must be at least 8 characters</div>
    </div>

    <div class="form-group">
        <label for="confirm">Confirm password</label>
        <div class="input-wrapper">
            <input type="password" id="confirm" name="confirm" placeholder="Repeat your password" required minlength="8" autocomplete="new-password">
            <button type="button" class="input-toggle" onclick="togglePassword('confirm')" aria-label="Toggle password visibility">
                <svg id="eyeIcon2" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>
        <div class="error-message">Passwords do not match</div>
    </div>

    <button type="submit" class="btn-primary">Reset password</button>
</form>

<a href="/" class="back-link">Back to sign in</a>
{{end}}

{{define "scripts"}}
<script>
    function togglePassword(id) {
        var input = document.getElementById(id);
        var iconId = id === 'password' ? 'eyeIcon1' : 'eyeIcon2';
        var icon = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
            input.type = 'password';
            icon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
        }
    }

    function handleSubmit(e) {
        e.preventDefault();
        var form = e.target;
        var pw = form.password;
        var confirm = form.confirm;
        var pwGroup = pw.closest('.form-group');
        var confirmGroup = confirm.closest('.form-group');

        pwGroup.classList.remove('error');
        confirmGroup.classList.remove('error');

        var valid = true;
        if (!pw.value || pw.value.length < 8) {
            pwGroup.classList.add('error');
            valid = false;
        }
        if (pw.value !== confirm.value) {
            confirmGroup.classList.add('error');
            valid = false;
        }
        if (valid) { form.submit(); }
        return false;
    }
</script>
{{end}}
