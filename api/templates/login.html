{{define "title"}} - Sign In{{end}}

{{define "content"}}
<div class="login-header">
    <h2>Sign in</h2>
    <p>Enter your credentials to continue</p>
</div>

<div id="resetSuccess" class="success-message"></div>

<form id="loginForm" method="POST" action="/login" onsubmit="return handleLogin(event)">
    <input type="hidden" name="sessionID" id="sessionId" value="{{.SessionID}}">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="form-group">
        <label for="login">Email</label>
        <div class="input-wrapper">
            <input type="email" id="login" name="login" placeholder="you@company.com" required autocomplete="username">
        </div>
        <div class="error-message">Please enter a valid email address</div>
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="input-toggle" onclick="togglePassword()" aria-label="Toggle password visibility">
                <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>
        <div class="error-message">Password is required</div>
    </div>

    <div class="form-options">
        <label class="remember-me">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
        </label>
        <a href="/forgot-password" class="forgot-link">Forgot password?</a>
    </div>

    <button type="submit" class="btn-primary">Sign in</button>
</form>
{{end}}

{{define "scripts"}}
<script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        if (params.get('reset') === 'success') {
            var el = document.getElementById('resetSuccess');
            el.textContent = 'Your password has been reset. You can now sign in.';
            el.style.display = 'block';
        }
    })();

    function togglePassword() {
        var input = document.getElementById('password');
        var icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
            input.type = 'password';
            icon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
        }
    }

    function handleLogin(e) {
        e.preventDefault();
        var form = e.target;
        var loginGroup = form.login.closest('.form-group');
        var passwordGroup = form.password.closest('.form-group');

        loginGroup.classList.remove('error');
        passwordGroup.classList.remove('error');

        var valid = true;
        if (!form.login.value || !form.login.value.includes('@')) {
            loginGroup.classList.add('error');
            valid = false;
        }
        if (!form.password.value) {
            passwordGroup.classList.add('error');
            valid = false;
        }
        if (valid) { form.submit(); }
        return false;
    }
</script>
{{end}}
